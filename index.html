
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小芳VIDEO STUDIES</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:#fff;font-family:Arial,sans-serif}
header{height:65px;background:#191a22;border-bottom:1px solid #30313b;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{font-size:19px;font-weight:bold;color:#a99bff}
.logo span{color:white}
button,.upload{border:0;border-radius:7px;padding:10px 15px;background:#7658e8;color:white;cursor:pointer;font-weight:bold}
button:hover,.upload:hover{background:#927afa}
input,select{background:#252631;color:white;border:1px solid #424350;padding:9px;border-radius:6px;max-width:100%}
main{padding:15px;max-width:1450px;margin:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:15px}
.panel{background:#191a22;border:1px solid #30313b;border-radius:10px;padding:14px;margin-bottom:15px}
h3{font-size:14px;color:#b6a9ff;margin:0 0 12px}
.preview{background:#08090d;border-radius:8px;min-height:260px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
canvas{width:100%;max-height:480px;object-fit:contain}
#empty{color:#888;text-align:center}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:13px;font-size:12px;color:#bbb}
.field input,.field select{width:100%}
.timeline{background:#191a22;border:1px solid #30313b;padding:14px;border-radius:10px;margin-top:15px}
.track{height:43px;background:#252631;border-radius:6px;margin-top:9px;position:relative;overflow:hidden}
.clip{height:100%;background:linear-gradient(90deg,#6750d9,#a27aff);display:flex;align-items:center;padding:8px;font-size:12px;white-space:nowrap;overflow:hidden}
.track-label{font-size:11px;color:#aaa;margin-top:12px}
.status{font-size:12px;color:#9c91ff;margin-top:10px}
@media(max-width:750px){.layout{grid-template-columns:1fr}header{padding:0 10px}.logo{font-size:15px}.preview{min-height:190px}main{padding:9px}}
</style>
</head>
<body>

<header>
  <div class="logo">小芳 <span>VIDEO STUDIES</span></div>
  <button onclick="exportVideo()">⬇ Экспорт</button>
</header>

<main>
  <div class="toolbar">
    <label class="upload">＋ Видео<input hidden type="file" id="videoFile" accept="video/*"></label>
    <label class="upload">＋ Фото<input hidden type="file" id="imageFile" accept="image/*"></label>
    <label class="upload">♫ Музыка<input hidden type="file" id="audioFile" accept="audio/*"></label>
    <button onclick="newProject()">Жаңа жоба</button>
  </div>

  <div class="layout">
    <section>
      <div class="panel">
        <h3>▶ VIDEO PREVIEW</h3>
        <div class="preview">
          <canvas id="canvas" width="1280" height="720"></canvas>
          <div id="empty">小芳 VIDEO STUDIES<br>Видео жүктеңіз</div>
        </div>
        <div class="controls">
          <button onclick="playVideo()">▶ Play</button>
          <button onclick="pauseVideo()">Ⅱ Pause</button>
          <button onclick="restartVideo()">↺ Басы</button>
        </div>
        <div class="status" id="status">Жоба дайын</div>
      </div>

      <div class="timeline">
        <h3>✂ TIMELINE — МОНТАЖ</h3>
        <div class="track-label">VIDEO TRACK</div>
        <div class="track"><div class="clip" id="videoClip" style="width:0%">Видео</div></div>
        <div class="track-label">AUDIO TRACK</div>
        <div class="track"><div class="clip" id="audioClip" style="width:0%;background:#168d86">Музыка</div></div>
        <div class="track-label">TEXT TRACK</div>
        <div class="track"><div class="clip" id="textClip" style="width:0%;background:#b17c35">Мәтін</div></div>
        <div class="field" style="margin-top:15px">
          <label>Видеоның уақытын таңдау</label>
          <input type="range" id="seek" min="0" max="100" value="0">
        </div>
      </div>
    </section>

    <aside>
      <div class="panel">
        <h3>⚙ ВИДЕО БАПТАУ</h3>
        <div class="field">
          <label>Басталу уақыты (секунд)</label>
          <input type="number" id="start" value="0" min="0" step="0.1">
        </div>
        <div class="field">
          <label>Аяқталу уақыты (секунд)</label>
          <input type="number" id="end" value="0" min="0" step="0.1">
        </div>
        <button style="width:100%" onclick="cutVideo()">✂ Кесу шекарасын қолдану</button>
        <div class="field" style="margin-top:15px">
          <label>Видео жылдамдығы</label>
          <select id="speed" onchange="changeSpeed()">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
          </select>
        </div>
        <div class="field">
          <label>Дыбыс деңгейі</label>
          <input type="range" id="volume" min="0" max="1" step="0.05" value="1" oninput="changeVolume()">
        </div>
      </div>

      <div class="panel">
        <h3>✍ МӘТІН ҚОСУ</h3>
        <div class="field">
          <label>Мәтін</label>
          <input id="textInput" placeholder="Мәтінді енгізіңіз">
        </div>
        <div class="field">
          <label>Мәтін түсі</label>
          <input type="color" id="textColor" value="#ffffff">
        </div>
        <div class="field">
          <label>Қаріп өлшемі</label>
          <input type="number" id="fontSize" value="55" min="10" max="150">
        </div>
        <button style="width:100%" onclick="draw()">Мәтінді қолдану</button>
      </div>

      <div class="panel">
        <h3>🎬 ФОРМАТ</h3>
        <div class="field">
          <label>Видео өлшемі</label>
          <select id="format" onchange="setFormat()">
            <option value="16:9">YouTube 16:9</option>
            <option value="9:16">TikTok 9:16</option>
            <option value="1:1">Instagram 1:1</option>
          </select>
        </div>
        <button style="width:100%" onclick="exportVideo()">⬇ Видеоны сақтау</button>
      </div>
    </aside>
  </div>
</main>

<video id="video" playsinline style="display:none"></video>
<audio id="music" loop></audio>

<script>
const video=document.getElementById('video');
const music=document.getElementById('music');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const status=document.getElementById('status');
let videoURL=null,audioURL=null,image=null;
let trimStart=0,trimEnd=0,animation=null,exporting=false;

function message(t){status.textContent=t}

document.getElementById('videoFile').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(f);
 video.src=videoURL;
 video.onloadedmetadata=()=>{
  trimStart=0;trimEnd=video.duration;
  document.getElementById('start').value=0;
  document.getElementById('end').value=video.duration.toFixed(2);
  document.getElementById('videoClip').style.width='100%';
  document.getElementById('empty').style.display='none';
  draw();message('Видео жүктелді');
 };
};

document.getElementById('audioFile').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 if(audioURL)URL.revokeObjectURL(audioURL);
 audioURL=URL.createObjectURL(f);
 music.src=audioURL;
 document.getElementById('audioClip').style.width='100%';
 message('Музыка қосылды');
};

document.getElementById('imageFile').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const url=URL.createObjectURL(f);
 image=new Image();
 image.onload=()=>{draw();message('Фото қосылды');};
 image.src=url;
};

function draw(){
 ctx.fillStyle='#08090d';
 ctx.fillRect(0,0,canvas.width,canvas.height);

 if(video.readyState>=2){
  const vw=video.videoWidth,vh=video.videoHeight;
  const scale=Math.min(canvas.width/vw,canvas.height/vh);
  const w=vw*scale,h=vh*scale;
  ctx.drawImage(video,(canvas.width-w)/2,(canvas.height-h)/2,w,h);
 }
 if(image){
  const scale=Math.min(canvas.width/image.width,canvas.height/image.height);
  const w=image.width*scale,h=image.height*scale;
  ctx.drawImage(image,(canvas.width-w)/2,(canvas.height-h)/2,w,h);
 }
 const txt=document.getElementById('textInput').value;
 if(txt){
  const size=Number(document.getElementById('fontSize').value)||55;
  ctx.font='bold '+size+'px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,0,0,.55)';
  ctx.fillText(txt,canvas.width/2+2,canvas.height*.83+2);
  ctx.fillStyle=document.getElementById('textColor').value;
  ctx.fillText(txt,canvas.width/2,canvas.height*.83);
 }
 if(!exporting)animation=requestAnimationFrame(draw);
}

function playVideo(){
 if(!video.src){message('Алдымен видео жүктеңіз');return}
 if(video.currentTime<trimStart||video.currentTime>=trimEnd)video.currentTime=trimStart;
 video.play();music.play().catch(()=>{});
}
function pauseVideo(){video.pause();music.pause()}
function restartVideo(){video.currentTime=trimStart;draw()}
function changeSpeed(){video.playbackRate=Number(document.getElementById('speed').value)}
function changeVolume(){video.volume=Number(document.getElementById('volume').value)}
function cutVideo(){
 const s=Number(document.getElementById('start').value);
 const e=Number(document.getElementById('end').value);
 if(!video.duration||s<0||e>video.duration||s>=e){
  message('Уақытты дұрыс енгізіңіз');return;
 }
 trimStart=s;trimEnd=e;
 video.currentTime=s;
 message('Кесу шекаралары қолданылды');
}
document.getElementById('seek').oninput=e=>{
 if(video.duration)video.currentTime=Number(e.target.value)/100*video.duration;
};
video.ontimeupdate=()=>{
 if(video.duration){
  document.getElementById('seek').value=video.currentTime/video.duration*100;
  if(video.currentTime>=trimEnd){video.pause();video.currentTime=trimStart}
 }
};
function setFormat(){
 const f=document.getElementById('format').value;
 if(f==='9:16'){canvas.width=720;canvas.height=1280}
 else if(f==='1:1'){canvas.width=900;canvas.height=900}
 else{canvas.width=1280;canvas.height=720}
 draw();
}
function newProject(){
 pauseVideo();
 video.removeAttribute('src');video.load();
 music.removeAttribute('src');music.load();
 image=null;videoURL=null;audioURL=null;
 trimStart=0;trimEnd=0;
 document.getElementById('textInput').value='';
 document.getElementById('videoClip').style.width='0%';
 document.getElementById('audioClip').style.width='0%';
 document.getElementById('textClip').style.width='0%';
 document.getElementById('empty').style.display='block';
 draw();message('Жаңа жоба ашылды');
}

async function exportVideo(){
 if(!video.src){message('Алдымен видео жүктеңіз');return}
 if(!window.MediaRecorder||!canvas.captureStream){
  message('Бұл браузер экспортты қолдамайды');return;
 }
 if(video.readyState<2){message('Видео дайындалуда');return}
 pauseVideo();
 exporting=true;
 cancelAnimationFrame(animation);
 const stream=canvas.captureStream(30);
 let sourceStream=null,audioStream=null;
 try{
  if(video.captureStream){
   sourceStream=video.captureStream();
   sourceStream.getAudioTracks().forEach(t=>stream.addTrack(t));
  }
  if(music.src){
   music.currentTime=0;
   await music.play().catch(()=>{});
   if(music.captureStream){
    audioStream=music.captureStream();
    audioStream.getAudioTracks().forEach(t=>stream.addTrack(t));
   }
  }
 }catch(err){console.log(err)}
 const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm';
 const recorder=new MediaRecorder(stream,{mimeType:mime});
 const chunks=[];
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 recorder.onstop=()=>{
  const blob=new Blob(chunks,{type:'video/webm'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='xiaofang-video.webm';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  stream.getTracks().forEach(t=>t.stop());
  if(sourceStream)sourceStream.getTracks().forEach(t=>t.stop());
  if(audioStream)audioStream.getTracks().forEach(t=>t.stop());
  exporting=false;draw();
  message('Видео сақталды!');
 };
 recorder.start();
 video.currentTime=trimStart;
 await new Promise(resolve=>{
  if(video.currentTime===trimStart)resolve();
  else video.onseeked=resolve;
 });
 video.playbackRate=Number(document.getElementById('speed').value);
 await video.play();
 message('Видео жазылып жатыр...');
 const check=()=>{
  if(video.currentTime>=trimEnd||video.ended){
   video.pause();music.pause();
   recorder.stop();
  }else if(exporting){
   requestAnimationFrame(check);
  }
 };
 check();
}
draw();
</script>
</body>
</html>
