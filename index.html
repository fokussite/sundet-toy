<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Light, Sunset and Dark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap">
  <style>
/* Light / dark / sunset toggle in the Lucy Bichakhchyan style.
   A pill track with a round knob that slides between three stops.
   Colors are registered custom properties, so the gradient, the knob
   and the page ease between themes instead of snapping. */

@property --bg        { syntax: "<color>"; inherits: true; initial-value: #1A1A1A; }
@property --t1        { syntax: "<color>"; inherits: true; initial-value: #2D253A; }
@property --t2        { syntax: "<color>"; inherits: true; initial-value: #574777; }
@property --t3        { syntax: "<color>"; inherits: true; initial-value: #6A578F; }
@property --stop      { syntax: "<color>"; inherits: true; initial-value: #BEADD6; }
@property --knob      { syntax: "<color>"; inherits: true; initial-value: #1A1A1A; }
@property --glyph     { syntax: "<color>"; inherits: true; initial-value: #AB8CF0; }
@property --rim       { syntax: "<color>"; inherits: true; initial-value: #574777; }

:root {
  --bg: #1A1A1A;
  --t1: #2D253A;
  --t2: #574777;
  --t3: #6A578F;
  --stop: #BEADD6;
  --knob: #1A1A1A;
  --glyph: #AB8CF0;
  --rim: #574777;
  --heavy: cubic-bezier(0.65, 0, 0.35, 1);
  --settle: cubic-bezier(0.16, 1, 0.3, 1);
  --t: 700ms;
  --w: 232px;
  --h: 88px;
  --pad: 8px;
  --knob-size: calc(var(--h) - var(--pad) * 2);
  --travel: calc((var(--w) - var(--pad) * 2 - var(--knob-size)) / 2);
  color-scheme: dark;
  transition:
    --bg var(--t) var(--heavy), --t1 var(--t) var(--heavy), --t2 var(--t) var(--heavy),
    --t3 var(--t) var(--heavy), --stop var(--t) var(--heavy), --knob var(--t) var(--heavy),
    --glyph var(--t) var(--heavy), --rim var(--t) var(--heavy);
}
:root[data-mood="light"] {
  --bg: #F6F6F4;
  --t1: #EEE9F6;
  --t2: #DCCFF6;
  --t3: #C4B0EE;
  --stop: #6A578F;
  --knob: #FFFFFF;
  --glyph: #6A578F;
  --rim: #C4B0EE;
  color-scheme: light;
}
:root[data-mood="sunset"] {
  --bg: #2D253A;
  --t1: #574777;
  --t2: #B4607E;
  --t3: #E2A06E;
  --stop: #FFF4EC;
  --knob: #2D253A;
  --glyph: #E2A06E;
  --rim: #E2C184;
  color-scheme: dark;
}
:root.is-instant, :root.is-instant * { transition: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: grid;
  place-items: center;
  background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.demo { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.sound {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px;
  border: 0; border-radius: 999px; background: none; color: var(--stop); opacity: 0.8;
  font: 500 13px/1 "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  cursor: pointer; transition: opacity 300ms ease;
}
.sound:hover { opacity: 1; }
.sound:focus-visible { opacity: 1; outline: 2px solid var(--glyph); outline-offset: 2px; }
.sound svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sound__off { display: none; }
.sound[aria-pressed="false"] .sound__wave { display: none; }
.sound[aria-pressed="false"] .sound__off { display: inline; }
.toggle {
  --i: 1;
  position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center;
  width: var(--w); height: var(--h); padding: var(--pad); border-radius: 999px;
  background: linear-gradient(120deg, var(--t1) 0%, var(--t2) 55%, var(--t3) 100%);
  box-shadow: inset 0 0 0 1px var(--rim);
}
.toggle__stop {
  position: relative; z-index: 1; display: grid; place-items: center; height: var(--knob-size);
  padding: 0; border: 0; border-radius: 50%; background: none; color: var(--stop);
  opacity: 0.75; cursor: pointer; transition: opacity 300ms ease; -webkit-tap-highlight-color: transparent;
}
.toggle__stop:hover { opacity: 1; }
.toggle__stop[aria-checked="true"] { opacity: 0; }
.toggle__stop:focus-visible { opacity: 1; outline: 2px solid var(--glyph); outline-offset: 2px; }
.toggle__stop svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform 600ms var(--settle); }
.toggle__stop[data-mood="light"]:hover svg { transform: rotate(45deg) scale(1.1); }
.toggle__stop[data-mood="dark"]:hover svg { transform: rotate(-18deg) scale(1.1); }
.toggle__stop[data-mood="sunset"]:hover svg { transform: translateY(-2px) scale(1.1); }
.toggle__knob {
  position: absolute; z-index: 2; top: var(--pad); left: var(--pad);
  width: var(--knob-size); height: var(--knob-size); pointer-events: none;
  transform: translateX(calc(var(--i) * var(--travel)));
  transition: transform 640ms var(--heavy);
}
.toggle__face {
  position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%;
  background: var(--knob); color: var(--glyph);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22), inset 0 0 0 1px var(--rim);
}
.glyph {
  position: absolute; width: 48px; height: 48px; overflow: visible; opacity: 0;
  transform: rotate(-70deg) scale(0.5);
  transition: opacity 360ms ease, transform 760ms var(--settle);
}
.ray, .sun-core, .moon-body, .star, .sunset-glow, .sunset-sun, .sunset-ripple { transform-box: fill-box; transform-origin: center; }
:root[data-mood="light"] .glyph--sun,
:root[data-mood="dark"] .glyph--moon,
:root[data-mood="sunset"] .glyph--sunset { opacity: 1; transform: rotate(0deg) scale(1); transition-delay: 160ms; }
.ray { stroke: #E2A06E; stroke-width: 2.4; stroke-linecap: round; transform-origin: center bottom; }
.sun-rays { transform-origin: 24px 24px; transform-box: view-box; }
:root[data-mood="light"] .ray { animation: ray-in 520ms var(--settle) calc(260ms + var(--n) * 55ms) backwards; }
:root[data-mood="light"] .sun-rays { animation: spin 26s linear 900ms infinite; }
:root[data-mood="light"] .sun-core { animation: core-in 700ms var(--settle) 160ms backwards; }
.star { fill: #F6F6F4; opacity: 0; }
:root[data-mood="dark"] .star { animation: star-in 520ms var(--settle) calc(420ms + var(--d) * 120ms) forwards, twinkle 2.6s ease-in-out calc(1100ms + var(--d) * 380ms) infinite; }
:root[data-mood="dark"] .moon-body { animation: moon-in 800ms var(--settle) 160ms backwards; }
.sunset-line { stroke: #E2C184; stroke-width: 1.8; stroke-linecap: round; }
.sunset-ripple { stroke: #E2A06E; stroke-width: 1.6; stroke-linecap: round; opacity: 0.75; }
.sunset-glow { opacity: 0; }
:root[data-mood="sunset"] .sunset-glow { animation: glow-in 900ms var(--settle) 200ms forwards, breathe 3.4s ease-in-out 1100ms infinite; }
:root[data-mood="sunset"] .sunset-sun { animation: sink 900ms var(--settle) 160ms backwards; }
:root[data-mood="sunset"] .sunset-ripple { animation: ripple-in 600ms var(--settle) calc(500ms + var(--n) * 120ms) backwards, shimmer 3.4s ease-in-out calc(1100ms + var(--n) * 300ms) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ray-in { from { transform: scaleY(0); opacity: 0; } }
@keyframes core-in { from { transform: scale(0.6); } }
@keyframes moon-in { from { transform: rotate(-35deg) scale(0.7); } }
@keyframes star-in { from { opacity: 0; transform: scale(0) rotate(-45deg); } to { opacity: 1; transform: scale(1) rotate(0deg); } }
@keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
@keyframes glow-in { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
@keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.12); } }
@keyframes sink { from { transform: translateY(-9px); } }
@keyframes ripple-in { from { transform: scaleX(0); opacity: 0; } }
@keyframes shimmer { 0%, 100% { opacity: 0.75; } 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) {
  :root, :root * { transition: none !important; animation: none !important; }
  .star, .sunset-glow { opacity: 1; }
}
  </style>
</head>
<body>
<div class="demo">
<div class="toggle" role="radiogroup" aria-label="Color theme">
  <span class="toggle__knob" aria-hidden="true">
    <span class="toggle__face">
      <svg class="glyph glyph--sun" data-for="light" viewBox="0 0 48 48">
        <defs>
          <radialGradient id="sun-core" cx="40%" cy="35%" r="70%">
            <stop offset="0" stop-color="#FFE9B8" />
            <stop offset="1" stop-color="#E2A06E" />
          </radialGradient>
        </defs>
        <g class="sun-rays">
          <g transform="rotate(0 24 24)"><line class="ray" style="--n:0" x1="24" y1="4" x2="24" y2="9.5" /></g>
          <g transform="rotate(45 24 24)"><line class="ray" style="--n:1" x1="24" y1="4" x2="24" y2="9.5" /></g>
          <g transform="rotate(90 24 24)"><line class="ray" style="--n:2" x1="24" y1="4" x2="24" y2="9.5" /></g>
          <g transform="rotate(135 24 24)"><line class="ray" style="--n:3" x1="24" y1="4" x2="24" y2="9.5" /></g>
          <g transform="rotate(180 24 24)"><line class="ray" style="--n:4" x1="24" y1="4" x2="24" y2="9.5" /></g>
          <g transform="rotate(225 24 24)"><line class="ray" style="--n:5" x1="24" y1="4" x2="24" y2="9.5" /></g>
          <g transform="rotate(270 24 24)"><line class="ray" style="--n:6" x1="24" y1="4" x2="24" y2="9.5" /></g>
          <g transform="rotate(315 24 24)"><line class="ray" style="--n:7" x1="24" y1="4" x2="24" y2="9.5" /></g>
        </g>
        <circle class="sun-core" cx="24" cy="24" r="9.5" fill="url(#sun-core)" />
      </svg>
      <svg class="glyph glyph--moon" data-for="dark" viewBox="0 0 48 48">
        <defs>
          <linearGradient id="moon-fill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F6F6F4" />
            <stop offset="1" stop-color="#AB8CF0" />
          </linearGradient>
        </defs>
        <g transform="translate(4 7) scale(1.5)">
          <path class="moon-body" d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1Z" fill="url(#moon-fill)" />
        </g>
        <path class="star" style="--d:0" d="M37 6.5Q37 10 40.5 10Q37 10 37 13.5Q37 10 33.5 10Q37 10 37 6.5Z" />
        <path class="star" style="--d:1" d="M42 19Q42 21 44 21Q42 21 42 23Q42 21 40 21Q42 21 42 19Z" />
        <path class="star" style="--d:2" d="M31 17.5Q31 19 32.5 19Q31 19 31 20.5Q31 19 29.5 19Q31 19 31 17.5Z" />
        <path class="star" style="--d:3" d="M41 31Q41 32.5 42.5 32.5Q41 32.5 41 34Q41 32.5 39.5 32.5Q41 32.5 41 31Z" />
      </svg>
      <svg class="glyph glyph--sunset" data-for="sunset" viewBox="0 0 48 48">
        <defs>
          <radialGradient id="sunset-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#F3C98A" stop-opacity="0.95" />
            <stop offset="0.45" stop-color="#E66A63" stop-opacity="0.5" />
            <stop offset="1" stop-color="#B4607E" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="sunset-sun" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F6D898" />
            <stop offset="1" stop-color="#E66A63" />
          </linearGradient>
          <clipPath id="sunset-sky">
            <rect x="0" y="0" width="48" height="30" />
          </clipPath>
        </defs>
        <circle class="sunset-glow" cx="24" cy="30" r="21" fill="url(#sunset-glow)" />
        <g clip-path="url(#sunset-sky)">
          <circle class="sunset-sun" cx="24" cy="30" r="10" fill="url(#sunset-sun)" />
        </g>
        <line class="sunset-line" x1="7" y1="30" x2="41" y2="30" />
        <line class="sunset-ripple" style="--n:0" x1="14" y1="35" x2="34" y2="35" />
        <line class="sunset-ripple" style="--n:1" x1="19" y1="39.5" x2="29" y2="39.5" />
      </svg>
    </span>
  </span>
  <button type="button" class="toggle__stop" role="radio" aria-checked="false" tabindex="-1" data-mood="light" aria-label="Light">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" />
    </svg>
  </button>
  <button type="button" class="toggle__stop" role="radio" aria-checked="false" tabindex="-1" data-mood="sunset" aria-label="Sunset">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 17a5 5 0 0 1 10 0" />
      <path d="M2.5 17h19M5.5 20.5h13M12 5.5V8M5.3 9.8l1.6 1.6M18.7 9.8l-1.6 1.6" />
    </svg>
  </button>
  <button type="button" class="toggle__stop" role="radio" aria-checked="false" tabindex="-1" data-mood="dark" aria-label="Dark">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1Z" />
    </svg>
  </button>
</div>
<button type="button" class="sound" aria-pressed="true">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
    <path class="sound__wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
    <path class="sound__off" d="M16 9.5l5 5M21 9.5l-5 5" />
  </svg>
  <span class="sound__label">Sound on</span>
</button>
</div>
<script>
// Light / sunset / dark toggle. CSS eases the colors and slides the knob;
// this picks the theme, adds the squash, plays a small sound and
// remembers the choice. Sounds are made live with the Web Audio API,
// so there are no files to load.
var SOUND_CHOICE = {
  light: 'chime',
  sunset: 'hum',
  dark: 'deepbell',
  slide: 'none'
};
(function () {
  var root = document.documentElement;
  var toggle = document.querySelector('.toggle');
  var face = toggle.querySelector('.toggle__face');
  var stops = Array.prototype.slice.call(toggle.querySelectorAll('.toggle__stop'));
  var moods = stops.map(function (s) { return s.dataset.mood; });
  var soundButton = document.querySelector('.sound');
  var soundLabel = soundButton.querySelector('.sound__label');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  var KEY = 'lucy-theme';
  var SOUND_KEY = 'lucy-theme-sound';
  function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function write(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  var ctx = null;
  var master = null;
  function audio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.55;
      master.connect(ctx.destination);
    }
    if (ctx.state !== 'running') ctx.resume();
    return ctx;
  }
  var silentLoop = null;
  var unlocked = false;
  function silentWav() {
    var samples = 800;
    var buffer = new ArrayBuffer(44 + samples);
    var view = new DataView(buffer);
    function text(at, s) { for (var i = 0; i < s.length; i++) view.setUint8(at + i, s.charCodeAt(i)); }
    text(0, 'RIFF'); view.setUint32(4, 36 + samples, true); text(8, 'WAVE');
    text(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, 8000, true); view.setUint32(28, 8000, true); view.setUint16(32, 1, true); view.setUint16(34, 8, true);
    text(36, 'data'); view.setUint32(40, samples, true);
    for (var i = 0; i < samples; i++) view.setUint8(44 + i, 128);
    return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
  }
  function unlock() {
    if (unlocked || !soundOn) return;
    unlocked = true;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    if (!navigator.audioSession) {
      silentLoop = new Audio(silentWav());
      silentLoop.loop = true;
      silentLoop.setAttribute('playsinline', '');
      silentLoop.volume = 0.01;
      var p = silentLoop.play();
      if (p && p.catch) p.catch(function () {});
    }
    if (!audio()) return;
    var src = ctx.createBufferSource();
    src.buffer = ctx.createBuffer(1, 1, 22050);
    src.connect(ctx.destination);
    src.start(0);
  }
  ['pointerdown', 'touchend', 'keydown'].forEach(function (type) {
    document.addEventListener(type, unlock, { capture: true, passive: true });
  });
  document.addEventListener('visibilitychange', function () {
    if (!silentLoop) return;
    if (document.hidden) silentLoop.pause();
    else if (soundOn) { var p = silentLoop.play(); if (p && p.catch) p.catch(function () {}); }
  });
  function tone(freq, at, length, opts) {
    opts = opts || {};
    var t = ctx.currentTime + at;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (opts.glide) osc.frequency.exponentialRampToValueAtTime(freq * opts.glide, t + length);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(opts.level || 0.08, t + (opts.attack || 0.01));
    gain.gain.exponentialRampToValueAtTime(0.0001, t + length);
    osc.connect(gain);
    gain.connect(opts.into || master);
    osc.start(t);
    osc.stop(t + length + 0.05);
  }
  function bell(freq, at, length, level) {
    [[1, 1], [2.01, 0.45], [3.02, 0.22], [4.17, 0.12]].forEach(function (p) {
      tone(freq * p[0], at, length / p[0] * 1.6, { level: level * p[1], attack: 0.005 });
    });
  }
  function noise(at, length, from, to, level) {
    var t = ctx.currentTime + at;
    var buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * length), ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    var src = ctx.createBufferSource();
    src.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 0.9;
    filter.frequency.setValueAtTime(from, t);
    filter.frequency.exponentialRampToValueAtTime(to, t + length * 0.6);
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(level, t + length * 0.35);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + length);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    src.start(t);
  }
  function warmFilter(open, length) {
    var t = ctx.currentTime;
    var filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(350, t);
    filter.frequency.exponentialRampToValueAtTime(open, t + length * 0.4);
    filter.frequency.exponentialRampToValueAtTime(500, t + length);
    filter.connect(master);
    return filter;
  }
  function tick(at, freq) {
    tone(freq || 2400, at, 0.06, { type: 'triangle', level: 0.05, attack: 0.002 });
  }
  var SOUND_LIBRARY = {
    light: {
      chime: { name: 'Rising chime', play: function () {
        [1046.5, 1318.5, 1568, 2093].forEach(function (f, n) {
          tone(f, 0.24 + n * 0.07, 0.9, { level: 0.06 });
          tone(f * 2, 0.24 + n * 0.07, 0.4, { level: 0.012 });
        });
      } },
      bell: { name: 'Glass bell', play: function () {
        bell(1318.5, 0.2, 1.8, 0.07);
        bell(1975.5, 0.32, 1.4, 0.035);
      } },
      musicbox: { name: 'Music box', play: function () {
        [1568, 1760, 2093, 2637, 2349.3].forEach(function (f, n) {
          tone(f, 0.2 + n * 0.09, 0.5, { type: 'triangle', level: 0.045, attack: 0.003 });
        });
      } },
      tick: { name: 'Soft tick', play: function () { tick(0.18, 2600); tick(0.24, 3200); } }
    },
    sunset: {
      swell: { name: 'Warm swell', play: function () {
        var filter = warmFilter(1800, 2.2);
        [196, 196 * 1.006, 246.9, 293.7].forEach(function (f) {
          tone(f, 0.15, 2.2, { type: 'triangle', level: 0.05, attack: 0.45, glide: 0.97, into: filter });
        });
      } },
      hum: { name: 'Low hum', play: function () {
        var filter = warmFilter(900, 2.4);
        [130.8, 196, 261.6].forEach(function (f, n) {
          tone(f, 0.12, 2.4, { level: 0.07 - n * 0.015, attack: 0.6, into: filter });
        });
      } },
      windchime: { name: 'Wind chimes', play: function () {
        [1174.7, 1396.9, 1046.5, 1568, 1318.5].forEach(function (f, n) {
          bell(f, 0.2 + n * 0.16 + Math.random() * 0.05, 1.2, 0.03);
        });
        noise(0.05, 1.2, 800, 2000, 0.015);
      } },
      tick: { name: 'Soft tick', play: function () { tick(0.18, 1800); tick(0.26, 1400); } }
    },
    dark: {
      pings: { name: 'Night pings', play: function () {
        tone(220, 0.12, 1.4, { level: 0.09, attack: 0.08 });
        tone(330, 0.16, 1.2, { level: 0.04, attack: 0.1 });
        [1760, 2349.3, 2093, 2637].forEach(function (f, n) {
          tone(f, 0.42 + n * 0.12, 0.5, { type: 'triangle', level: 0.035 });
        });
      } },
      deepbell: { name: 'Deep bell', play: function () {
        bell(196, 0.16, 2.6, 0.09);
        tone(98, 0.16, 2.2, { level: 0.04, attack: 0.05 });
      } },
      twinkle: { name: 'Twinkle', play: function () {
        [2637, 3136, 2793.8, 3520, 2349.3, 3951].forEach(function (f, n) {
          tone(f, 0.38 + n * 0.09, 0.35, { level: 0.028, attack: 0.004 });
        });
      } },
      tick: { name: 'Soft tick', play: function () { tick(0.18, 1200); tick(0.26, 900); } }
    },
    slide: {
      whoosh: { name: 'Whoosh', play: function (distance) { noise(0, 0.32 + 0.12 * distance, 500, 2200, 0.05); } },
      tick: { name: 'Click', play: function () { tick(0, 1600); } },
      none: { name: 'None', play: function () {} }
    }
  };
  function playSound(group, id, distance) {
    if (!audio()) return;
    var sound = SOUND_LIBRARY[group] && SOUND_LIBRARY[group][id];
    if (sound) sound.play(distance || 1);
  }
  var soundOn = read(SOUND_KEY) !== 'off';
  function play(mood, distance) {
    if (!soundOn || !audio()) return;
    var go = function () {
      playSound('slide', SOUND_CHOICE.slide, distance);
      playSound(mood, SOUND_CHOICE[mood], distance);
    };
    if (ctx.state === 'running') go();
    else ctx.resume().then(go, go);
  }
  function setSound(on) {
    soundOn = on;
    soundButton.setAttribute('aria-pressed', on ? 'true' : 'false');
    soundLabel.textContent = on ? 'Sound on' : 'Sound off';
    write(SOUND_KEY, on ? 'on' : 'off');
    if (silentLoop) {
      if (on) { var p = silentLoop.play(); if (p && p.catch) p.catch(function () {}); }
      else silentLoop.pause();
    }
  }
  soundButton.addEventListener('click', function () { setSound(!soundOn); });
  setSound(soundOn);
  window.themeSounds = { library: SOUND_LIBRARY, choice: SOUND_CHOICE, play: playSound };
  function setMood(mood, animate) {
    var from = moods.indexOf(root.dataset.mood);
    var i = moods.indexOf(mood);
    if (i < 0 || i === from) return;
    root.dataset.mood = mood;
    toggle.style.setProperty('--i', i);
    stops.forEach(function (s, n) {
      s.setAttribute('aria-checked', n === i ? 'true' : 'false');
      s.tabIndex = n === i ? 0 : -1;
    });
    write(KEY, mood);
    if (!animate) return;
    play(mood, Math.abs(i - from));
    if (face.animate && !reduced.matches) {
      var stretch = 1 + 0.16 * Math.abs(i - from);
      face.animate(
        [
          { transform: 'scale(1, 1)' },
          { transform: 'scale(' + stretch + ', ' + (2 - stretch) + ')', offset: 0.45 },
          { transform: 'scale(0.96, 1.04)', offset: 0.8 },
          { transform: 'scale(1, 1)' }
        ],
        { duration: 680, easing: 'ease-in-out' }
      );
    }
  }
  stops.forEach(function (s) {
    s.addEventListener('click', function () { setMood(s.dataset.mood, true); });
  });
  toggle.addEventListener('keydown', function (e) {
    var i = moods.indexOf(root.dataset.mood);
    var next = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: moods.length - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    next = (next + moods.length) % moods.length;
    setMood(moods[next], true);
    stops[next].focus();
  });
  var start = read(KEY);
  if (moods.indexOf(start) < 0) {
    start = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  root.classList.add('is-instant');
  setMood(start, false);
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { root.classList.remove('is-instant'); });
  });
})();
</script>
</body>
