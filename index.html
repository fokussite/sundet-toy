<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CapCut KZ - TikTok Style</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box}
 body{margin:0;background:linear-gradient(180deg,#1A0033,#0D001A);color:#fff;font-family:'Manrope',sans-serif;text-align:center;padding-bottom:40px}
 .top{padding:16px;font-family:'Unbounded',sans-serif;font-size:20px;background:linear-gradient(90deg,#FF0050,#00F2EA);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
 .phone{width:95%;max-width:380px;margin:auto;background:#000;border-radius:28px;overflow:hidden;border:3px solid #333;position:relative;box-shadow:0 20px 50px rgba(255,0,80,.4)}
 video{width:100%;height:520px;object-fit:cover;display:block;background:#000}
 #subtitleBox{position:absolute;bottom:70px;left:12px;right:12px;pointer-events:none}
 #subtitle{font-family:'Unbounded',sans-serif;font-size:24px;line-height:1.3;font-weight:700;text-transform:uppercase}
 #subtitle span{background:#FF0050;padding:2px 8px;border-radius:8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
 #subtitle span:nth-child(2n){background:#00F2EA;color:#000}
 #subtitle span:nth-child(3n){background:#FFE500;color:#000}
 .controls{background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border-radius:20px;padding:14px;margin:12px auto;max-width:380px;text-align:left;border:1px solid rgba(255,255,255,.15)}
 .controls b{font-size:15px}
 button{border:none;border-radius:999px;padding:12px 16px;margin:5px 3px;font-weight:800;font-family:'Manrope',sans-serif;cursor:pointer;font-size:14px}
 .btn-pink{background:#FF0050;color:#fff}
 .btn-cyan{background:#00F2EA;color:#000}
 .btn-yellow{background:#FFE500;color:#000}
 .btn-white{background:#fff;color:#000}
 input,select,textarea{width:100%;padding:11px;border-radius:12px;border:none;margin:6px 0;background:#222;color:#fff;font-family:'Manrope',sans-serif}
 .pill{display:inline-block;background:#333;padding:6px 12px;border-radius:999px;font-size:12px;margin:3px;cursor:pointer}
 .pill.active{background:#FF0050}
 #status{font-size:13px;color:#00F2EA;margin:6px}
</style>
</head>
<body>

<div class="top">CAPCUT KZ • TIKTOK STYLE</div>

<div class="phone">
  <video id="myVideo" controls playsinline></video>
  <div id="subtitleBox"><div id="subtitle"><span>МӘТІН ОСЫНДА</span></div></div>
</div>

<div id="status">● Дайын - видео жүкте</div>

<input type="file" id="upload" accept="video/*" style="max-width:380px">

<!-- АВТО СУБТИТР - БАСТЫ -->
<div class="controls">
  <b>🎤 АВТО СУБТИТР - TikTok стилінде</b><br>
  <button class="btn-pink" id="btnAutoSub">🎤 Авто-субтитрді қосу</button>
  <button class="btn-white" id="btnStopSub">⏹ Тоқтату</button>
  <div>
    <span class="pill active" data-style="tiktok">TikTok</span>
    <span class="pill" data-style="karaoke">Караоке</span>
    <span class="pill" data-style="minimal">Минимал</span>
    <span class="pill" data-style="neon">Неон</span>
  </div>
  <textarea id="textInput">Сәлем! Біз сізді күтеміз! Жаңа коллекция келді!</textarea>
  <button class="btn-yellow" id="btnText">✅ Мәтінді қолдану</button>
  <div style="font-size:12px;opacity:.7">Сөйлесең - автоматты түрде қазақша жазылады. Қолмен жазсаң да болады.</div>
</div>

<!-- МОНТАЖ -->
<div class="controls">
  <b>✂️ МОНТАЖ</b><br>
  <input type="number" id="startTime" value="0" placeholder="Басы (сек)">
  <input type="number" id="endTime" value="5" placeholder="Аяғы (сек)">
  <button class="btn-cyan" id="btnTrim">✂️ Қырқу</button>
  <button class="btn-white" id="btnSpeed">⚡ 2x Жылдам</button>
  <button class="btn-white" id="btnSlow">🐢 0.5x Баяу</button>
</div>

<!-- МУЗЫКА + ШАҚЫРТУ -->
<div class="controls">
  <b>🎵 МУЗЫКА & 📢 ШАҚЫРТУ</b><br>
  <select id="musicList">
    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">🔥 Тренд - Энергиялы</option>
    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">💖 Жайлы - Салонға</option>
    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3">🎉 Тойға - Көңілді</option>
  </select>
  <button class="btn-pink" id="btnMusic">▶️ Музыка</button>
  <button class="btn-white" id="btnStopMusic">⏹ Тоқтату</button><br>
  <button class="btn-yellow" id="btnInvite1">🛍️ Дүкен</button>
  <button class="btn-yellow" id="btnInvite2">💅 Салон</button>
  <button class="btn-yellow" id="btnInvite3">☕ Кафе</button>
</div>

<button class="btn-pink" id="btnSave" style="padding:16px 40px;font-size:17px;">⬇️ САҚТАУ</button>

<script>
const video=document.getElementById('myVideo');
const subtitle=document.getElementById('subtitle');
const statusEl=document.getElementById('status');
const music=new Audio(); music.loop=true;
let rec=null;

function setStatus(t){ statusEl.innerText='● '+t; }
function renderSubtitle(text){
  // Сөздерді бөліп, әрқайсысын түрлі түске бояу - TikTok стилі
  let words=text.split(' ').filter(w=>w);
  if(!words.length) return;
  subtitle.innerHTML=words.map(w=>'<span>'+w+'</span>').join(' ');
}

document.getElementById('upload').addEventListener('change',e=>{
  video.src=URL.createObjectURL(e.target.files[0]);
  setStatus('Видео жүктелді! Авто-субтитрді қос');
});

document.getElementById('btnAutoSub').addEventListener('click',()=>{
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert('Chrome браузерде аш! Safari-де істемейді'); return; }
  if(rec){ rec.stop(); }
  rec=new SR(); rec.lang='kk-KZ'; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{
    let t='';
    for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript;
    renderSubtitle(t);
    document.getElementById('textInput').value=t;
  };
  rec.onend=()=>{ if(rec) rec.start(); };
  rec.start();
  setStatus('🎤 Тыңдап жатырмын... Сөйле!');
  alert('Сөйле! Қазақша субтитр TikTok стилінде шығады');
});

document.getElementById('btnStopSub').addEventListener('click',()=>{
  if(rec){ rec.onend=null; rec.stop(); rec=null; setStatus('Субтитр тоқтатылды'); }
});

document.getElementById('btnText').addEventListener('click',()=>{
  renderSubtitle(document.getElementById('textInput').value);
  setStatus('Мәтін қолданылды!');
});

// Стильдер
document.querySelectorAll('.pill').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    let s=p.dataset.style;
    let sub=document.getElementById('subtitle');
    if(s=='tiktok'){ sub.style.fontFamily="'Unbounded',sans-serif"; sub.style.textTransform='uppercase'; }
    if(s=='karaoke'){ sub.style.fontFamily="'Manrope',sans-serif"; sub.style.textTransform='none'; sub.style.fontSize='28px'; }
    if(s=='minimal'){ sub.style.fontFamily="'Manrope',sans-serif"; sub.style.textTransform='none'; sub.style.fontSize='20px'; }
    if(s=='neon'){ sub.style.fontFamily="'Unbounded',sans-serif"; sub.style.textShadow='0 0 15px #FF0050, 0 0 30px #00F2EA'; }
    setStatus('Стиль: '+s);
  });
});

document.getElementById('btnTrim').addEventListener('click',()=>{
  let s=Number(document.getElementById('startTime').value);
  let e=Number(document.getElementById('endTime').value);
  video.currentTime=s; video.play();
  let c=setInterval(()=>{ if(video.currentTime>=e){ video.pause(); clearInterval(c); setStatus('Қырқылды: '+s+'-'+e+' сек'); } },300);
});
document.getElementById('btnSpeed').addEventListener('click',()=>{ video.playbackRate=2; video.play(); });
document.getElementById('btnSlow').addEventListener('click',()=>{ video.playbackRate=0.5; video.play(); });

document.getElementById('btnMusic').addEventListener('click',()=>{
  music.src=document.getElementById('musicList').value; music.volume=0.25; music.play();
  setStatus('Музыка ойнап жатыр');
});
document.getElementById('btnStopMusic').addEventListener('click',()=>music.pause());

function setInvite(txt){ document.getElementById('textInput').value=txt; renderSubtitle(txt); setStatus('Шақырту қойылды!'); }
document.getElementById('btnInvite1').addEventListener('click',()=>setInvite('Жаңа коллекция келді! Бағасы тиімді! Бүгін кел!'));
document.getElementById('btnInvite2').addEventListener('click',()=>setInvite('Сұлулығыңды бізбен аш! Бүгін жазыл 20% жеңілдік!'));
document.getElementById('btnInvite3').addEventListener('click',()=>setInvite('Дәмді тағам жылы атмосфера! Достарыңмен кел!'));

document.getElementById('btnSave').addEventListener('click',()=>alert('Видео дайын! Видеоға ұзақ басып - Сақтауды бас'));

renderSubtitle('Сәлем! Біз сізді күтеміз!');
setStatus('Код жүктелді - бәрі істеу керек!');
</script>
</body>
</html>
